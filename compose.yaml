services:
  # The type checker MCP. .mcp.json starts it for the agent.
  picoruby-ti-mcp:
    build: docker/picoruby-ti-mcp
    volumes:
      - .:/workspace:ro

  # The type checker MCP with the ESP32-2432S028's classes, such as Touch.
  picoruby-ti-mcp-2432s028:
    build:
      context: docker/picoruby-ti-mcp
      args:
        AREA512_SIG_DIR: picoruby_cyd
    image: area512-picoruby-ti-mcp-2432s028
    volumes:
      - .:/workspace:ro

  # Runs an app's logic tests with PicoRuby on this machine, without the
  # emulator: docker compose run --rm picoruby apps/<name> <test.rb>...
  picoruby:
    build: tools/picoruby
    image: area512-picoruby
    working_dir: /workspace
    volumes:
      - .:/workspace:ro

  # Makes .a5d dot images and image.h start screens.
  assets:
    build: tools/assets
    volumes:
      - .:/workspace

  # http://localhost:8080 runs the emulator of the Cardputer in your browser.
  emulator:
    build: emulator
    image: area512-emulator
    ports:
      - "${AREA512_EMULATOR_PORT:-8080}:8080"
    volumes:
      - ./apps:/workspace/apps:ro

  # Compiles an app's Ruby files to .mrb in its folder.
  compiler:
    image: area512-emulator
    pull_policy: never
    entrypoint: ["sh", "/srv/emulator/compile_app.sh"]
    working_dir: /workspace
    volumes:
      - .:/workspace

  # The agent's own emulator, in headless Chromium.
  emulator-browser:
    build: emulator/browser
    depends_on:
      - emulator
    volumes:
      - ./screenshots:/workspace/screenshots
      - ./bots:/workspace/bots:ro

  # The emulator of the ESP32-2432S028: http://localhost:8081.
  emulator-2432s028:
    profiles: ["2432s028"]
    build:
      context: emulator
      args:
        AREA512_BOARD: "2432s028"
    image: area512-emulator-2432s028
    ports:
      - "${AREA512_EMULATOR_2432S028_PORT:-8081}:8080"
    volumes:
      - ./apps:/workspace/apps:ro

  # The agent's own emulator of the ESP32-2432S028, in headless Chromium.
  emulator-browser-2432s028:
    profiles: ["2432s028"]
    build: emulator/browser
    depends_on:
      - emulator-2432s028
    environment:
      AREA512_EMULATOR_URL: http://emulator-2432s028:8080
    volumes:
      - ./screenshots:/workspace/screenshots
      - ./bots:/workspace/bots:ro
